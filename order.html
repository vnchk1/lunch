<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshLunch — Собрать ланч</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="order.css">
  <link rel="stylesheet" href="print.css" media="print">
</head>
<body>

<header>
  <h1>FreshLunch</h1>
  <nav>
    <ul>
      <li><a href="index.html">О нас</a></li>
      <li><a href="order.html" class="active">Собрать ланч</a></li>
      <li><a href="feedback.html">Обратная связь</a></li>
      <li><a href="auth.html">Вход</a></li>
    </ul>
  </nav>
</header>

<main>
  <h2>Соберите свой идеальный ланч</h2>

  <!-- Форма заказа -->
  <form action="https://httpbin.org/post" method="POST" id="order-form" class="order-form">
    <div class="form-columns">

      <div class="form-block">
        <h3>Ваш заказ</h3>
        <div id="order-box">Ничего не выбрано</div>

        <input type="hidden" id="soupInput" name="soup">
        <input type="hidden" id="mainInput" name="main">
        <input type="hidden" id="drinkInput" name="drink">
        <input type="hidden" id="saladInput" name="salad">
        <input type="hidden" id="dessertInput" name="dessert">

        <label for="comment">Комментарий к заказу</label>
        <textarea id="comment" name="comment"></textarea>
      </div>

      <div class="form-block">
        <h3>Ваши данные</h3>

        <label for="name">Имя</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="subscribe" id="discount-label">
          <input type="checkbox" id="subscribe" name="subscribe" checked>
          Получать акции и скидки
        </label>

        <label for="phone">Телефон</label>
        <input type="tel" id="phone" name="phone" required>

        <label for="address">Адрес доставки</label>
        <input type="text" id="address" name="address" required>
        <p><em>Доставка осуществляется только по Москве</em></p>

        <fieldset>
          <legend>Время доставки</legend>
          <label><input type="radio" name="delivery" value="asap" required> Как можно скорее</label><br>
          <label><input type="radio" name="delivery" value="later"> К указанному времени</label>
        </fieldset>

        <label for="time">Укажите время доставки</label>
        <input type="time" id="time" name="time" min="07:00" max="23:00" step="300">
      </div>

    </div>

    <div class="form-actions">
      <button type="reset">Сбросить</button>
      <button type="submit">Отправить</button>
    </div>
  </form>
</main>

<footer>
  <p>📞 <a href="tel:+79197615291">+7 (919) 761-52-91</a></p>
</footer>

<script src="dishes.js"></script>
<script src="render.js"></script>

</body>
</html>
